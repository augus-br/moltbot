name: Workflow Sanity

on:
  workflow_dispatch:
  schedule:
  - cron: 42 4 * * 6

jobs:
  no-tabs:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_POLICY || 
      '{"linux":["ubuntu-24.04"],"arm64":["ubuntu-24.04-arm"],"x64":["ubuntu-24.04"],"hosted":true}').linux }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fail on tabs in workflow files
      run: |
        python - <<'PY'
        from __future__ import annotations

        import pathlib
        import sys

        root = pathlib.Path(".github/workflows")
        bad: list[str] = []
        for path in sorted(root.rglob("*.yml")):
          if b"\t" in path.read_bytes():
            bad.append(str(path))

        for path in sorted(root.rglob("*.yaml")):
          if b"\t" in path.read_bytes():
            bad.append(str(path))

        if bad:
          print("Tabs found in workflow file(s):")
          for path in bad:
            print(f"- {path}")
          sys.exit(1)
        PY
    timeout-minutes: 60
