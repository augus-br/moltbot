name: Auto response

on:
  workflow_dispatch:
  schedule:
  - cron: 17 17 * * 5

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-response:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_POLICY || 
      '{"linux":["ubuntu-24.04"],"arm64":["ubuntu-24.04-arm"],"x64":["ubuntu-24.04"],"hosted":true}').linux }}
    steps:
    - uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: '2729701'
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
    - name: Handle labeled items
      uses: actions/github-script@v7
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          // Labels prefixed with "r:" are auto-response triggers.
          const rules = [
            {
              label: "r: skill",
              close: true,
              message:
                "Thanks for the contribution! New skills should be published to Clawdhub for everyone to use. Weâ€™re keeping the core lean on skills, so Iâ€™m closing this out.",
            },
            {
              label: "r: support",
              close: true,
              message:
                "Please use our support server https://molt.bot/discord and ask in #help or #users-helping-users to resolve this, or follow the stuck FAQ at https://docs.molt.bot/help/faq#im-stuck-whats-the-fastest-way-to-get-unstuck.",
            },
            {
              label: "r: third-party-extension",
              close: true,
              message:
                "This would be better made as a third-party extension with our SDK that you maintain yourself. Docs: https://docs.molt.bot/plugin.",
            },
          ];

          const labelName = context.payload.label?.name;
          if (!labelName) {
            return;
          }

          const rule = rules.find((item) => item.label === labelName);
          if (!rule) {
            return;
          }

          const issueNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;
          if (!issueNumber) {
            return;
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
            body: rule.message,
          });

          if (rule.close) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: "closed",
            });
          }
    timeout-minutes: 60
    if: ${{ (true) && (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') }}
  weekly-review:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_POLICY || 
      '{"linux":["ubuntu-24.04"],"arm64":["ubuntu-24.04-arm"],"x64":["ubuntu-24.04"],"hosted":true}').linux }}
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    steps:
    - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: |
          const items = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', per_page: 100});
          await core.summary.addHeading('Weekly label review').addRaw(`${items.length} open issues/PRs; event-specific handlers require a real event and configured GitHub App.`).write();
